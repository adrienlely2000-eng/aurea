<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0b09" />
  <title>Aurea — suivi financier</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect rx='8' width='32' height='32' fill='%230c0b09'/><circle cx='16' cy='16' r='7' fill='none' stroke='%23d4b483' stroke-width='2'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <strong>Aurea</strong>
        <span>Suivi financier</span>
      </div>
    </div>
    <nav class="side-nav" id="side-nav">
      <button data-view="dashboard" class="is-active">Tableau de bord</button>
      <button data-view="accounts">Comptes</button>
      <button data-view="transactions">Mouvements</button>
      <button data-view="recurrings">Forfaits & dettes</button>
      <button data-view="year">Année</button>
      <button data-view="budget">Budget</button>
      <button data-view="forecast">Prévisions</button>
      <button data-view="goals">Objectifs</button>
      <button data-view="settings">Réglages</button>
    </nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>

  <div class="app">
    <header class="topbar">
      <button class="icon-btn menu-btn" data-action="toggle-nav" aria-label="Menu">☰</button>
      <div class="period-nav" id="period-nav"></div>
      <button class="btn ghost lock-btn" data-action="lock">Verrouiller</button>
      <div class="top-actions">
        <button class="btn ghost" data-action="open-search">Rechercher</button>
        <button class="btn gold" data-action="quick-add">Ajouter</button>
      </div>
    </header>
    <main id="main" class="main"></main>
  </div>

  <nav class="bottom-nav" id="bottom-nav">
    <button data-view="dashboard" class="is-active"><span>Accueil</span></button>
    <button data-view="transactions"><span>Mouvements</span></button>
    <button class="fab-wrap" data-action="quick-add" aria-label="Ajouter"><span class="fab">+</span></button>
    <button data-view="recurrings"><span>Forfaits</span></button>
    <button data-view="accounts"><span>Comptes</span></button>
  </nav>

  <div class="modal-root" id="modal-root" hidden></div>
  <div class="toast-root" id="toast-root"></div>
  <div class="onboard-root" id="onboard-root" hidden></div>
  <div class="search-root" id="search-root" hidden></div>
  <input id="import-file" type="file" accept="application/json" hidden />
  <input id="import-csv" type="file" accept=".csv,text/csv,text/plain,.txt" hidden />

  <script src="js/store.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
